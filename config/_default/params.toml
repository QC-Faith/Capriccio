[params]
env = "production"
title = "Capriccio"
description = "QC-Faith 的个人笔记博客"
keywords = ["Blog", "Notes", "PaperMod"]
author = "QC-Faith"
DateFormat = "2006-01-02"

# 夜间模式
defaultTheme = "auto"          # auto, dark, light
disableThemeToggle = false     # 显示主题切换按钮

# 文章信息显示
ShowReadingTime = true
ShowWordCount = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
disableScrollToTop = false
hidemeta = false
hideSummary = false

# 目录（TOC）
UseHugoToc = true              # 用 Hugo 内置目录
showtoc = true                 # 默认展示目录
tocopen = false                # 默认不展开（想展开改成 true）

# 评论总开关（你不需要评论）
comments = false

# 首页主内容 sections —— 这里用 "post"，你就可以继续用 content/post
mainSections = ["post"]

[params.homeInfoParams]
Title = "Hi there 👋"
Content = "欢迎来到 Capriccio，这是 QC-Faith 的个人笔记本。"

# 右上角 / 主页的社交图标
[[params.socialIcons]]
name = "github"
url = "https://github.com/QC-Faith"

# 搜索配置（PaperMod 使用 Fuse.js）
[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 2
limit = 10
keys = ["title", "permalink", "summary", "content"]
