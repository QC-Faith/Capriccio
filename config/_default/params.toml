# 哪些 section 的文章会出现在首页和归档页
# 注意：Stack 默认文章放在 content/post/ 目录下，对应 section 名是 "post"
mainSections = ["post"]

# RSS 是否输出全文
rssFullContent = true

# 网站 favicon（图标）
# 你可以把图标文件放在 static/favicon.png，这里就写 "/favicon.png"
favicon = "/favicon.png"

[footer]
# 页脚年份，从你搭建博客的年份开始
since = 2025
# 页脚自定义文字（可留空）
customText = "我想试试文字的力量。"

[dateFormat]
# 文章发布日期格式（Go 时间格式）
# 例如：2025-11-13
published = "2025-11-13"
# 最后更新日期格式，例如：2025-11-13 15:04
lastUpdated = "2025-11-13 15:04"

[sidebar]
# 侧边栏头像旁边的小表情
emoji = "📒"
# 侧边栏的副标题（自我介绍一句话）
subtitle = "人生如逆旅，我亦是行人。"

[sidebar.avatar]
enabled = true
local = true
# 头像路径：如果你放在 static/img/avatar.png，这里写 "img/avatar.png"
src = "img/avatar.png"

[article]
# 标题右侧是否显示锚点小链接（#）
headingAnchor = false
# 是否启用数学公式（配合 markup 的 LaTeX 设置）
math = false
# 是否显示“阅读时间”
readingTime = true

[article.license]
# 是否在文章底部显示版权/授权信息
enabled = false
default = "Licensed under CC BY-NC-SA 4.0"

## 首页右侧/底部组件（widgets）
[[widgets.homepage]]
type = "search"

[[widgets.homepage]]
type = "archives"

[widgets.homepage.params]
limit = 5

[[widgets.homepage]]
type = "categories"

[widgets.homepage.params]
limit = 10

[[widgets.homepage]]
type = "tag-cloud"

[widgets.homepage.params]
limit = 10

# 文章页的 widget：目录
[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = ""
card = "summary_large_image"

[defaultImage.opengraph]
enabled = false
local = false
src = ""

[colorScheme]
# 是否显示“暗色/亮色”切换按钮
toggle = true
# 默认跟随系统 "auto" / 强制亮 "light" / 强制暗 "dark"
default = "auto"

[imageProcessing.cover]
enabled = true

[imageProcessing.content]
enabled = true

