# 部署到 GitHub Pages 的地址
baseurl = "https://QC-Faith.github.io/Capriccio/"

# 页面语言（影响 <html lang="..."> 和 SEO）
languageCode = "zh-cn"

# 左侧标题 & 浏览器标题
title = "Capriccio"

# 主题的多语言支持：默认语言
# 支持：en, fr, id, ja, ko, pt-br, zh-cn, zh-tw, es, de, nl, it, th, el, uk, ar
defaultContentLanguage = "zh-cn"

# 中文 / 日文 / 韩文要设为 true，WordCount / Summary 等才会正常
hasCJKLanguage = true

# Disqus 评论的短域名（你不用 Disqus，就留空）
disqusShortname = ""

[pagination]
# 每页显示多少文章
pagerSize = 10
